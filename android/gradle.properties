# Project-wide Gradle settings
# Heap raised from 3 GB: earlier builds died with hs_err_pid* (native malloc failures) when the machine ran out of RAM.
# Do not run a build while a training job is using most of the memory.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m
org.gradle.parallel=false
org.gradle.workers.max=4
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
